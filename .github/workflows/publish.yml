# Publishes the banklink package to PyPI using trusted publishing (OIDC): no PyPI token is
# stored anywhere. One-time setup on pypi.org, project banklink → Publishing → Add a
# trusted publisher: GitHub, owner aurvex-labs, repo banklink-python, workflow publish.yml,
# environment pypi.
#
# Run it from Actions → Publish to PyPI → Run workflow, or by publishing a GitHub release.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
